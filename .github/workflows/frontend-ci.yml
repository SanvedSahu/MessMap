name: Frontend CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - 'dev'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  frontend-build-and-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify package-lock.json
        working-directory: frontend
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "Error: frontend/package-lock.json not found!"
            exit 1
          fi

      - name: Install dependencies (clean install)
        working-directory: frontend
        run: npm ci

      - name: Run static analysis (Oxlint)
        working-directory: frontend
        run: npx -y oxlint@1.88.0

      - name: Build TypeScript and bundle with Vite
        working-directory: frontend
        run: npm run build
