name: Backend CI

on:
  push:
    branches:
      - 'dev'
      - 'integration/**'
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - 'dev'
      - 'integration/**'
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check backend readiness
        id: check_backend
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "pom_exists=true" >> "$GITHUB_OUTPUT"
            echo "backend/pom.xml found. Proceeding with Spring Boot CI."
          else
            echo "pom_exists=false" >> "$GITHUB_OUTPUT"
            echo "backend/pom.xml not found. Safely skipping backend CI until backend is initialized."
          fi

      - name: Set up Java 17 LTS
        if: steps.check_backend.outputs.pom_exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        if: steps.check_backend.outputs.pom_exists == 'true'
        working-directory: backend
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean verify
          else
            echo "Maven wrapper (mvnw) not found, using system maven."
            mvn clean verify
          fi

      - name: Upload Surefire test reports on failure
        if: failure() && steps.check_backend.outputs.pom_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
