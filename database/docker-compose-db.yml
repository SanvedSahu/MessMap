services:
  mysql:
    image: mysql:8.0
    container_name: messmap-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-messmap_db}
      MYSQL_USER: ${MYSQL_USER:-messmap_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-messmap_secret_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-messmap_root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - messmap_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-messmap_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  messmap_mysql_data:
    driver: local
